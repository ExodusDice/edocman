# Server Port
server.port=8080

# Database Configuration (Default: H2 in-memory database for immediate local running)
spring.datasource.url=jdbc:h2:mem:edocmandb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Supabase / PostgreSQL Database Configuration (Uncomment and configure for live database)
# spring.datasource.url=jdbc:postgresql://db.xxxx.supabase.co:5432/postgres
# spring.datasource.username=postgres
# spring.datasource.password=your-supabase-db-password
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Multipart Upload Limits (For uploading legal document scans)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Sentry Error Tracking configuration
sentry.dsn=https://examplePublicKey@o0.ingest.sentry.io/0
sentry.traces-sample-rate=1.0

# Stripe API Keys (For service payments)
# Set your real stripe secret key to enable live transactions
stripe.api.key=sk_test_51MockKey12345
stripe.webhook.secret=whsec_MockWebhookSecret12345
stripe.simulation=true

# Clerk Auth Config
# JWKS URL to verify Clerk JWT signatures
clerk.jwks.url=https://api.clerk.com/v1/jwks
clerk.simulation=true

# Resend Email Configuration (For transactional emails)
resend.api.key=${RESEND_API_KEY:re_MockApiKey12345}
resend.sender=${RESEND_SENDER:no-reply@edocman.paperless.in.th}
resend.simulation=false



# Supabase Storage Integration Config (For file uploads)
supabase.url=https://mock-project.supabase.co
supabase.anon.key=sb_mock_anon_key
supabase.bucket=legal-documents
supabase.simulation=true
